services:
  - type: web
    name: cervify-portal
    env: node
    plan: free # Can use free plan for web services
    buildCommand: npm run install-all && npm run build-client && npm run init-db
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false # User can configure their own Google OAuth Client ID in Render UI
    disk:
      name: cervify-database-disk
      mountPath: /opt/render/project/src/server/database
      sizeGB: 1
